<!doctype html>
<html lang="en">
<head>

<title>Candle wax calculator</title>
<meta name="robots" content="noindex">

<body class="t-elec embed" data-calc="jar">
<main class="wrap">
<h1 class="embed-title">Candle wax calculator</h1>
<div class="calc card"><div class="fields"><div class="full"><div class="seg" id="junit" role="group" aria-label="Weight unit"><button data-v="oz" aria-pressed="true">Ounces</button><button data-v="g" aria-pressed="false">Grams</button></div></div><div id="jwater-row"><label for="jwater">Jar holds <small id="jwater-unit">(oz of water)</small></label><input id="jwater" inputmode="decimal" value="8"></div><div id="jfactor-row"><label for="jfactor">Wax factor <small id="jfactor-unit">(0.86 is typical)</small></label><input id="jfactor" inputmode="decimal" value="0.86"></div><div id="jload-row"><label for="jload">Fragrance load <small id="jload-unit">(% of the wax)</small></label><input id="jload" inputmode="decimal" value="8"></div><div id="jcount-row"><label for="jcount">Candles</label><input id="jcount" inputmode="numeric" value="12"></div><div class=full id="jextra-row"><label for="jextra">Extra for spills <small id="jextra-unit">(%)</small></label><input id="jextra" inputmode="decimal" value="5"></div></div><div class="result" aria-live="polite"><div class="eyebrow">Per candle</div><div class="big" id="j-wax">–</div><div class="rows"><div><span>Fragrance per candle</span><span id="j-fo">–</span></div><div><span>Wax + fragrance per candle</span><span id="j-fill">–</span></div><div><span>Wax for the batch</span><span id="j-twax">–</span></div><div><span>Fragrance for the batch</span><span id="j-tfo">–</span></div></div><p class="note">Pour one test candle, weigh it and adjust the wax factor for your wax and jar.</p></div></div>
<p class="powered">Powered by <a href="https://zhukovskyi.space/calculators/candles/candle-wax-calculator.html" target="_blank" rel="noopener">Dre Dev Tools</a></p>
</main>
<script src="../assets/calc-more.js?v=fa10168d"></script>
</body>
</html>
