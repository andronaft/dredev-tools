<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragrance load calculator</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://zhukovskyi.space/calculators/candles/fragrance-load-calculator.html">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/calc-more.css">
</head>
<body class="t-elec embed" data-calc="frag">
<main class="wrap">
<h1 class="embed-title">Fragrance load calculator</h1>
<div class="calc card"><div class="fields"><div class="full"><div class="seg" id="funit" role="group" aria-label="Weight unit"><button data-v="oz" aria-pressed="true">Ounces</button><button data-v="g" aria-pressed="false">Grams</button></div></div><div id="fwax-row"><label for="fwax">Wax weight <small id="fwax-unit">(oz)</small></label><input id="fwax" inputmode="decimal" value="16"></div><div id="fload-row"><label for="fload">Fragrance load <small id="fload-unit">(% of the wax)</small></label><input id="fload" inputmode="decimal" value="8"></div><div class="full"><label for="fwaxtype">Wax <small>(optional, checks the supplier's listed load)</small></label><select id="fwaxtype"></select></div></div><div class="result" aria-live="polite"><div class="eyebrow">Fragrance oil</div><div class="big" id="f-fo">–</div><div class="rows"><div><span>Wax + fragrance</span><span id="f-total">–</span></div><div><span>Same load, other basis</span><span id="f-total-pct">–</span></div><div><span>Rate</span><span id="f-perlb">–</span></div></div><div id="f-warn" class="verdict"></div></div></div>
<p class="powered">Powered by <a href="https://zhukovskyi.space/calculators/candles/fragrance-load-calculator.html" target="_blank" rel="noopener">Dre Dev Tools</a></p>
</main>
<script>window.CALC_DATA = {"waxes":[["Golden Brands 464 soy wax",10],["Golden Brands 444 soy wax",10],["IGI 6006 paraffin-soy blend",10],["IGI 4630 paraffin",10],["IGI 4627 paraffin",12]]};</script><script src="../assets/calc-more.js"></script>
</body>
</html>
