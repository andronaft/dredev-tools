<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concrete slab calculator</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://zhukovskyi.space/calculators/concrete/concrete-slab-calculator.html">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/calc-more.css">
</head>
<body class="t-slab embed" data-calc="slab">
<main class="wrap">
<h1 class="embed-title">Concrete slab calculator</h1>
<div class="calc card"><div class="fields"><div id="sl-row"><label for="sl">Length <small id="sl-unit">(ft)</small></label><input id="sl" inputmode="decimal" value="20"></div><div id="sw-row"><label for="sw">Width <small id="sw-unit">(ft)</small></label><input id="sw" inputmode="decimal" value="20"></div><div id="st-row"><label for="st">Thickness <small id="st-unit">(in)</small></label><input id="st" inputmode="decimal" value="4"></div><div id="sextra-row"><label for="sextra">Extra for waste <small id="sextra-unit">(%)</small></label><input id="sextra" inputmode="decimal" value="10"></div><div class=full><label for="sspace">Rebar spacing <small>(#4 bar, 20 ft sticks)</small></label><select id="sspace"><option value="12">12 in on centre</option><option value="16" selected>16 in on centre</option><option value="18">18 in on centre</option><option value="24">24 in on centre</option></select></div></div><div class="result" aria-live="polite"><div class="eyebrow">Concrete, with the extra</div><div class="big" id="sb-yd">–</div><div class="rows"><div><span>In cubic feet</span><span id="sb-ft3">–</span></div><div><span>Ready-mix order (next ¼ yd)</span><span id="sb-order">–</span></div><div><span>80 lb bags</span><span id="sb-80">–</span></div><div><span>60 lb bags</span><span id="sb-60">–</span></div><div><span>40 lb bags</span><span id="sb-40">–</span></div><div><span>Rebar grid</span><span id="sb-rebar">–</span></div></div><p class="note">Thickness, reinforcement and bar spacing come from your plans, engineer or building department. This sizes the order.</p></div></div>
<p class="powered">Powered by <a href="https://zhukovskyi.space/calculators/concrete/concrete-slab-calculator.html" target="_blank" rel="noopener">Dre Dev Tools</a></p>
</main>
<script src="../assets/calc-more.js"></script>
</body>
</html>
