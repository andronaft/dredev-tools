<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espresso ratio calculator</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://zhukovskyi.space/calculators/coffee/espresso-ratio-calculator.html">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/calc-more.css">
</head>
<body class="t-roof embed" data-calc="ratio">
<main class="wrap">
<h1 class="embed-title">Espresso ratio calculator</h1>
<div class="calc card"><div class="fields"><div class="full"><div class="seg" id="emode" role="group" aria-label="What to find"><button data-v="ratio" aria-pressed="true">Ratio</button><button data-v="yield" aria-pressed="false">Yield</button><button data-v="dose" aria-pressed="false">Dose</button></div></div><div class=full id="edose-row"><label for="edose">Dose in <small id="edose-unit">(g of ground coffee)</small></label><input id="edose" inputmode="decimal" value="18"></div><div class=full id="eyield-row"><label for="eyield">Yield out <small id="eyield-unit">(g of espresso)</small></label><input id="eyield" inputmode="decimal" value="36"></div><div class=full id="eratio-row"><label for="eratio">Ratio 1 : <small id="eratio-unit">(for example 2)</small></label><input id="eratio" inputmode="decimal" value="2"></div></div><div class="result" aria-live="polite"><div class="eyebrow">Result</div><div class="big" id="e-main">–</div><div class="rows"><div><span>Dose in</span><span id="e-dose">–</span></div><div><span>Yield out</span><span id="e-yield">–</span></div><div><span>Brew ratio</span><span id="e-ratio">–</span></div><div><span>Style</span><span id="e-style">–</span></div></div><p class="note">A starting point. Your taste decides.</p></div></div>
<p class="powered">Powered by <a href="https://zhukovskyi.space/calculators/coffee/espresso-ratio-calculator.html" target="_blank" rel="noopener">Dre Dev Tools</a></p>
</main>
<script src="../assets/calc-more.js"></script>
</body>
</html>
