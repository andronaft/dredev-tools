<h1 class="embed-title">Lye calculator (NaOH)</h1>
<div class="calc card"><div class="fields"><div class="full" id="oils"></div>
<div class="full"><button type="button" class="btn ghost" id="add-oil">+ Add oil</button></div>

<div><label for="conc">Lye concentration <small>(%)</small></label><input id="conc" inputmode="decimal" value="33"></div>
<div><label for="purity">NaOH purity <small>(%)</small></label><input id="purity" inputmode="decimal" value="100"></div></div><div class="result" aria-live="polite"><div class="eyebrow">Weigh out</div><div class="big" id="l-naoh">–</div>
<div class="rows"><div><span>Water</span><span id="l-water">–</span></div><div><span>Oils</span><span id="l-oils">–</span></div>
<div><span>Water : lye</span><span id="l-ratio">–</span></div><div><span>Batch</span><span id="l-batch">–</span></div></div>
<p class="note">Lye is caustic: gloves, goggles, ventilation, and always add lye to water, never water to lye.</p></div></div>
<p class="powered">Powered by <a href="https://zhukovskyi.space/calculators/soap/lye-calculator.html" target="_blank" rel="noopener">Dre Dev Tools</a></p>
